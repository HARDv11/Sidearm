<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('sidearm.theme')||'dark'}catch(e){}</script>
<script src="look.js"></script>
<script>try{if(localStorage.getItem('sidearm.lang')==='uk')document.write('<script src="lang/uk.js"><\/script>')}catch(e){}</script>
<script src="i18n.js"></script>
<title>Sidearm</title>
<link rel="stylesheet" href="sidearm.css">
</head>
<body class="chrome-page">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-reticle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1.5v6M12 16.5v6M1.5 12h6M16.5 12h6" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 3h6l-1 6 4 4H6l4-4z M12 13v8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-holster" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-reload" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 4v4.5h-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 3v5.5c0 4.6-3.2 8.2-7.5 9.5-4.3-1.3-7.5-4.9-7.5-9.5V6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5C6.5 4.2 9.5 4.2 12 6c2.5-1.8 5.5-1.8 8-.5v13c-2.5-1.3-5.5-1.3-8 .5-2.5-1.8-5.5-1.8-8-.5zM12 6v13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-fog" viewBox="0 0 24 24"><path d="M4 8h12M7 12h13M4 16h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-word" viewBox="0 0 24 24"><path d="M4 18l4.5-12h1L14 18M5.8 13.5h6.4M15.5 9.5h5M18 7v13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-zoom" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5M6.5 9.5V19h4v-5h3v5h4V9.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4zM15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-muted" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4zM15.5 9.5l5 5M20.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-ghost" viewBox="0 0 24 24"><path d="M6 20V11a6 6 0 0 1 12 0v9l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="10" cy="11" r="1" fill="currentColor"/><circle cx="14" cy="11" r="1" fill="currentColor"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.5 12h17M12 3.5c2.6 2.4 3.8 5.2 3.8 8.5s-1.2 6.1-3.8 8.5M12 3.5C9.4 5.9 8.2 8.7 8.2 12s1.2 6.1 3.8 8.5" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3L5.5 13.5H11L10 21l8-11h-5.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-pop" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="11.5" y="11" width="7" height="5" rx="1" fill="currentColor"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<div id="root">
  <div id="chrome">
    <header id="strip" title="Drag to move · Ctrl + scroll for opacity">
      <button id="brand" class="brand" title="Start page (Home key)"><svg class="reticle"><use href="#i-reticle"/></svg><span>Sidearm</span></button>
      <div id="ticker" class="ticker"><span id="tagline" class="tagline"></span></div>
      <button id="timers" class="readout timers" hidden title="Timer. Click to stop it"><span class="lbl">&#x23F1;</span><b></b></button>
      <div id="mem" class="readout" title="Ammo counter: Sidearm's total RAM, every engine process included"><span class="lbl">RAM</span><b>&mdash;</b></div>
 <button id="gear" class="icon" title="Settings"><svg><use href="#i-gear"/></svg></button>
      <button id="pin" class="icon" title="Pin: stay on screen when the game has focus"><svg><use href="#i-pin"/></svg></button>
      <button id="holsterBtn" class="icon" title="Holster (Esc)"><svg><use href="#i-holster"/></svg></button>
    </header>

    <div id="barrow">
      <button id="back" class="icon nav" title="Back (Alt + Left)"><svg><use href="#i-back"/></svg></button>
      <button id="fwd" class="icon nav" title="Forward (Alt + Right)"><svg><use href="#i-fwd"/></svg></button>
      <button id="reload" class="icon nav" title="Reload (F5)"><svg><use href="#i-reload"/></svg></button>
      <label id="bar" class="bar">
        <span id="badge" class="badge" hidden></span>
        <input id="q" type="text" spellcheck="false" autocomplete="off" aria-label="Search or address">
        <span id="idle" class="idle"><span class="t"></span><span class="h"></span></span>
        <span id="inline" class="inline" hidden></span>
      </label>
      <button id="zoom" class="zoom" hidden>100%</button>
      <button id="sound" class="icon sound" title="Sound" hidden><svg><use href="#i-muted"/></svg></button>
      <button id="shield" class="shield" title="This page: ads, reader, fog, dark, zoom" hidden><svg><use href="#i-shield"/></svg><b></b></button>
      <button id="newtab" class="icon" title="New tab (Ctrl + T)"><svg><use href="#i-plus"/></svg></button>
    </div>

    <nav id="tabs" class="tabs" aria-label="Tabs"></nav>
    <div id="progress" class="progress"></div>
  </div>

  <div id="palette" class="palette" hidden></div>
  <div id="panel" class="panel" hidden></div>
</div>

<script src="query.js"></script>
<script src="app.js"></script>
</body>
</html>
