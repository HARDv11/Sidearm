<main class="nt">
  <section class="nt-hero">
    <svg class="scope" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="ring2" cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="1"/>

<script>
/* 0.8: pinned sites and notes. They live in Sidearm's data folder (pins.json, notes.txt), so the page asks the shell. */
(function () {
  var wv = window.chrome && window.chrome.webview;
  if (!wv) return; // opened in an ordinary browser: just the manual
  var dock = document.getElementById('dock'), pinsBox = document.getElementById('pins');
  var notes = document.getElementById('notes'), state = document.getElementById('notesState');
  var MAX = 12, pins = [], got = false, dirty = false, saveTimer = 0, dragFrom = -1;
  function T(x) { return window.SidearmI18n ? window.SidearmI18n.T(x) : x; }
  function post(m) { try { wv.postMessage(m); } catch (e) {} }
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function host(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; } }

  function savePins() { post({ t: 'pins-set', list: pins }); renderPins(); }

  function renderPins() {
    pinsBox.textContent = '';
    pins.forEach(function (p, i) {
      var a = el('a', 'pin');
      a.href = p.url; a.title = p.title + '\n' + host(p.url); a.draggable = true;
      var ico = el('span', 'ico');
      var letter = el('b', null, (p.title || host(p.url)).trim().charAt(0).toUpperCase());
      ico.appendChild(letter);
      if (p.icon) {
        var img = new Image();
        img.alt = ''; img.referrerPolicy = 'no-referrer';
        img.onload = function () { if (img.naturalWidth > 1) { ico.classList.add('has-img'); } };
        img.onerror = function () { img.remove(); };
        img.src = p.icon;
        ico.appendChild(img);
      }
      a.appendChild(ico);
      var nm = el('span', 'nm', p.title); nm.dataset.raw = ''; a.appendChild(nm);
      var x = el('button', 'x', '\u00d7'); x.type = 'button'; x.title = 'Remove from the start page';
      x.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); pins.splice(i, 1); savePins(); });
      a.appendChild(x);
      a.addEventListener('dragstart', function (e) { dragFrom = i; a.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', p.url); });
      a.addEventListener('dragend', function () { dragFrom = -1; a.classList.remove('dragging'); pinsBox.querySelectorAll('.over').forEach(function (n) { n.classList.remove('over'); }); });
      a.addEventListener('dragover', function (e) { if (dragFrom < 0) return; e.preventDefault(); a.classList.add('over'); });
      a.addEventListener('dragleave', function () { a.classList.remove('over'); });
      a.addEventListener('drop', function (e) {
        e.preventDefault();
        if (dragFrom < 0 || dragFrom === i) return;
        var moved = pins.splice(dragFrom, 1)[0];
        pins.splice(i, 0, moved);
        dragFrom = -1;
        savePins();
      });
      pinsBox.appendChild(a);
    });
    if (pins.length < MAX) pinsBox.appendChild(addTile());
  }

  function addTile() {
    var box = el('div', 'pin add');
    var b = el('button', 'plus'); b.type = 'button'; b.title = 'Pin a site';
    b.appendChild(el('span', 'ico', '+'));
    b.appendChild(el('span', 'nm', 'Add'));
    box.appendChild(b);
    b.addEventListener('click', function () {
      box.classList.add('editing');
      var f = el('form', 'pin-form');
      var inp = el('input'); inp.type = 'text'; inp.placeholder = 'Address, e.g. hoyolab.com'; inp.spellcheck = false; inp.autocomplete = 'off';
      f.appendChild(inp);
      f.addEventListener('submit', function (e) {
        e.preventDefault();
        var v = inp.value.trim();
        if (!v) { renderPins(); return; }
        var url = /^https?:\/\//i.test(v) ? v : 'https://' + v;
        var origin = ''; try { origin = new URL(url).origin; } catch (x) { inp.classList.add('bad'); return; }
        pins.push({ title: '', url: url, icon: origin + '/favicon.ico' });
        savePins();
      });
      inp.addEventListener('keydown', function (e) { if (e.key === 'Escape') { e.stopPropagation(); renderPins(); } });
      inp.addEventListener('blur', function () { setTimeout(function () { if (box.isConnected && !inp.value.trim()) renderPins(); }, 150); });
      box.textContent = '';
      box.appendChild(f);
      inp.focus();
    });
    return box;
  }

  // notes: one free-text box, saved a moment after you stop typing
  function fit() { notes.style.height = 'auto'; notes.style.height = Math.min(notes.scrollHeight + 2, 420) + 'px'; }
  notes.addEventListener('input', function () {
    dirty = true; fit();
    state.textContent = ''; state.classList.remove('on');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNotes, 600);
  });
  notes.addEventListener('blur', function () { if (dirty) { clearTimeout(saveTimer); saveNotes(); } });
  notes.addEventListener('keydown', function (e) { if (e.key === 'Escape') e.stopPropagation(); }, true);
  function saveNotes() {
    dirty = false;
    post({ t: 'notes-set', text: notes.value });
    state.textContent = T('Saved'); state.classList.add('on');
    setTimeout(function () { state.classList.remove('on'); }, 1400);
  }
  window.addEventListener('beforeunload', function () { if (dirty) saveNotes(); });

  wv.addEventListener('message', function (e) {
    var m = e.data;
    if (!m || typeof m !== 'object') return;
    if (m.t === 'pins') {
      pins = (m.list || []).slice(0, MAX);
      if (!pinsBox.querySelector('.pin-form input:focus')) renderPins();
      reveal();
    } else if (m.t === 'notes') {
      // a line added from the bar: take it, unless you're typing here right now
      if (!(dirty && document.activeElement === notes)) { notes.value = m.text || ''; dirty = false; fit(); }
      reveal();
    }
  });
  // 0.9: Raven's unread messages, above the notes (pinned friends first; Settings → Raven)
  var rvh = document.getElementById('rvh');
  function avatar(n, size) {
    var w = el('span', 'rv-av'); w.style.width = w.style.height = size + 'px';
    var img = new Image(); img.alt = ''; img.src = 'avatars/' + (n >= 0 && n <= 4 ? n : 0) + '.webp';
    var big = Math.round(size / 0.68); img.style.width = img.style.height = big + 'px'; img.style.left = img.style.top = Math.round((size - big) / 2) + 'px';
    w.appendChild(img); return w;
  }
  function hm(ms) { var d = new Date(ms), p = function (x) { return (x < 10 ? '0' : '') + x; }; return d.toDateString() === new Date().toDateString() ? p(d.getHours()) + ':' + p(d.getMinutes()) : p(d.getDate()) + '.' + p(d.getMonth() + 1); }
  function renderRaven(r) {
    if (!r || !r.on || (!r.list.length && !r.requests)) { rvh.hidden = true; rvh.textContent = ''; return; }
    rvh.hidden = false; rvh.textContent = '';
    var head = el('div', 'rvh-head');
    var h2 = el('h2');
    h2.innerHTML = '<svg viewBox="0 0 49 52" aria-hidden="true"><use href="#rvh-wing"/></svg>';
    h2.appendChild(el('span', null, r.title || 'Raven'));
    head.appendChild(h2);
    if (r.total) head.appendChild(el('span', 'rvh-count', T(r.total === 1 ? '1 unread' : r.total + ' unread')));
    if (r.requests) head.appendChild(el('span', 'rvh-count', T(r.requests === 1 ? '1 friend request' : r.requests + ' friend requests')));
    var all = el('button', 'rvh-all', 'All chats'); all.type = 'button';
    all.addEventListener('click', function () { post({ t: 'raven-open', key: '*' }); });
    head.appendChild(all);
    rvh.appendChild(head);
    r.list.forEach(function (f) {
      var row = el('button', 'rvh-row'); row.type = 'button';
      row.addEventListener('click', function () { post({ t: 'raven-open', key: f.key }); });
      row.appendChild(avatar(f.av, 40));
      var t = el('span', 'rvh-t');
      var n = el('span', 'rvh-n');
      var nm = el('strong', null, f.name); nm.dataset.raw = ''; n.appendChild(nm);
      var at = el('span', 'rvh-at', hm(f.at)); at.dataset.raw = ''; n.appendChild(at);
      t.appendChild(n);
      var tx = el('span', 'rvh-text', f.text || ''); tx.dataset.raw = '';
      if (f.url) { var hs = el('span', 'host', (f.text ? ' · ' : '') + host(f.url)); tx.appendChild(hs); }
      t.appendChild(tx);
      row.appendChild(t);
      row.appendChild(el('span', 'rvh-dot'));
      rvh.appendChild(row);
    });
  }
  wv.addEventListener('message', function (e) { if (e.data && e.data.t === 'raven-home') renderRaven(e.data.raven); });

  // 0.9.5: drawings and marked-up screenshots, kept with the notes (data\notes\drawings)
  var drRow = document.getElementById('drRow'), drAll = document.getElementById('drAll'), drShowAll = false;
  function renderDrawings(list, total) {
    drRow.textContent = '';
    var add = el('button', 'dr-tile dr-new'); add.type = 'button'; add.title = T('A blank sheet');
    add.innerHTML = '<span>+</span>';
    add.appendChild(el('small', null, 'New drawing'));
    add.addEventListener('click', function () { post({ t: 'drawings-open', id: null }); });
    drRow.appendChild(add);
    (list || []).forEach(function (d) {
      var b = el('button', 'dr-tile'); b.type = 'button';
      if (d.thumb) b.style.backgroundImage = 'url("' + d.thumb + '")';
      var cap = el('span', 'dr-cap', d.title || hm(d.updated)); cap.dataset.raw = '';
      b.title = (d.title ? d.title + ' · ' : '') + new Date(d.updated).toLocaleString();
      b.appendChild(cap);
      if (d.shot) b.appendChild(el('i', 'dr-shot'));
      b.addEventListener('click', function () { post({ t: 'drawings-open', id: d.id }); });
      drRow.appendChild(b);
    });
    drAll.hidden = !(total > (list || []).length) && !drShowAll;
    drAll.textContent = drShowAll ? T('Fewer') : T('All') + ' · ' + total;
  }
  drAll.addEventListener('click', function () { drShowAll = !drShowAll; post({ t: 'drawings-get', all: drShowAll }); });
  wv.addEventListener('message', function (e) { if (e.data && e.data.t === 'drawings') renderDrawings(e.data.list, e.data.total); });

  function reveal() { if (!got) { got = true; dock.hidden = false; fit(); } }
  post({ t: 'home-get' });
})();
</script>

      ['Stamps (S)|Text (T)', 'Crosshair, skull, GG and friends (the wheel sizes them); text gets an outline that reads on anything'],
      ['🌈 color', 'Rainbow ink'],
      ['Save to notes|Ctrl + S', 'Kept under Drawings on this page; it opens again to keep drawing, and saves itself from then on'],
      ['Copy|Save file|To a friend', 'The finished picture: the clipboard, a PNG file, or Raven (a sharp WebP)'],
      ['+ under Drawings', 'A blank sheet']
    ]],
    ['Downloads & scrolling', [
      ['Alt + drag over a page', 'A box: everything in it to download, pictures at their largest, file links and videos'],
      ['Untick what you don\'t want → Download', 'Into Downloads\\<site>, with the site\'s sign-in; Change picks another folder'],
      ['Hold the middle button and move', 'Scroll joystick: the further you pull, the faster, in any direction'],
      ['Click the middle button', 'The joystick stays on until the next click or Esc; the wheel changes its speed'],
      ['Settings → Feel → Scroll joystick', 'Its speed, or a key that starts it where the pointer is']
    ]],
    ['Gestures', null],
    ['Feel', [
      [GK, 'Ghost mode: see-through and click-through, so a map or guide stays up while you play'],
      [GK + ' again|' + HK, 'Solid again'],
      ['Alt + M|speaker button', 'Mute or unmute this tab (new pages start muted)'],
      ['Ctrl + Shift + C', 'Copy the selection as plain text; nothing selected copies a clean page link'],
      ['Right-click a link → Copy link', 'Copies it without utm_*, fbclid and other trackers'],
      ['Ctrl + C on the address', 'Clean link too'],
      ['Settings → Feel', 'Amnesia mode: every holster wipes history, cookies and recent searches']
    ]],
    ['Words', [
      ['Hold Alt over a word', 'Meaning, Wikipedia summary, Ukrainian translation (works right after drawing, no click needed)'],
      ['Shield → Word look-up', 'Switch it off or on for one site; Alt on a switched-off site offers to turn it back on'],
      ['Double-click a word', 'Same pop-up'],
      ['Select text, hold Alt over it', 'Look up a whole phrase'],
      ['Right-click a selection', 'Look up · Ask ' + AI + ' about it'],
      ['t …|tt …', 'Google Translate / DeepL (uk ↔ en)']
    ]],
    ['Images', [
      ['Hover an image, Ctrl Ctrl', 'Open it in the viewer (the full-size original when there is one)'],
      ['Scroll|drag|double-click', 'Zoom at the pointer / pan / fit ↔ 1:1'],
      ['R', 'Rotate'],
      ['C|S', 'Copy / save to Downloads'],
      ['P', 'Pop out into its own always-on-top window'],
      ['Lens|TinEye|Bing', 'Reverse image search'],
      ['Esc|click the backdrop', 'Close']
    ]],
    ['Ask AI', [
      ['a your question', 'Asks ' + AI + ' (your pick in Settings → Ask AI)'],
      ['c …|gpt …|px …', 'Always Claude / ChatGPT / Perplexity'],
      ['Right-click a page|a link|a selection', 'Send it to ' + AI],
      ['Ask ' + AI + ' button', 'In the word pop-up'],
      ['Settings → Ask AI', 'Claude, ChatGPT, Gemini, Perplexity or Copilot; app, tab or browser'],
      ['Gemini app', 'Opens with your question on the clipboard: press Ctrl + V']
    ]],
    ['Translate', [
      ['Alt + T', 'Translate this page (again for the original)'],
      ['Shield → Translate', 'Same, plus “always translate this site”'],
      ['Translate button', 'Appears once per site when a page isn\'t in a language you read'],
      ['Settings → Translate', 'Target language, languages you read, offer or always'],
      ['Settings → Translate → In place', 'The words change on the real page, so you stay signed in (experimental)']
    ]],
    ['Look', [
      ['Settings → Look', 'Your color, a two-color gradient, tint and grain']
    ]],
    ['Updates', [
      ['Update button in a toast', 'Downloads the new version from GitHub, checks it, and restarts into it'],
      ['Settings → General → Updates', 'Check now, see what\'s new, or switch the daily check off']
    ]]
  ];

  var groups = document.getElementById('groups');
  function kbds(keys) {
    var wrap = document.createElement('span');
    wrap.className = 'm-keys';
    keys.split('|').forEach(function (k, i) {
      if (i) { var or = document.createElement('i'); or.textContent = 'or'; wrap.appendChild(or); }
      var b = document.createElement('kbd'); b.textContent = k; wrap.appendChild(b);
    });
    return wrap;
  }
  G.forEach(function (g) {
    var rows = g[1];
    if (!rows && g[0] === 'Gestures') {
      rows = [];
      if (!gest) rows.push(['Settings → Gestures', 'Gestures are off; turn them on there']);
      else {
        ['L', 'R', 'U', 'D', 'UD', 'DR', 'DL'].forEach(function (k) {
          if (gest[k] && GNAME[gest[k]]) rows.push([k.split('').map(function (d) { return ARROWS[d]; }).join(' then '), GNAME[gest[k]]]);
        });
        Object.keys(SHAPES).forEach(function (k) { if (gest[k] && GNAME[gest[k]]) rows.push([SHAPES[k], GNAME[gest[k]]]); });
        rows.unshift(['Hold right button, flick', 'About 40 px; a plain right-click still opens the menu']);
        rows.push(['Hold right button, draw a shape', 'Circle, square, triangle, ✓, Z or a zigzag; or your own (Settings → Gestures → Record)']);
        rows.push(['Settings → Gestures', 'Change or switch off any of them']);
      }
    }
    if (!rows) {
      rows = Object.keys(bangs).map(function (k) { return [k + ' …', bangs[k].name || k]; });
      if (!rows.length) rows = [['w …', 'Wikipedia'], ['i …', 'Images'], ['y …', 'YouTube']];
      rows.push(['Settings → Search', 'Add, change or remove prefixes']);
    }
    var sec = document.createElement('section');
    sec.className = 'm-group';
    var h = document.createElement('h3'); h.textContent = g[0]; sec.appendChild(h);
    var list = document.createElement('dl');
    rows.forEach(function (r) {
      var row = document.createElement('div');
      row.className = 'm-row';
      row.dataset.text = (g[0] + ' ' + r[0] + ' ' + r[1]).toLowerCase();
      var dt = document.createElement('dt'); dt.appendChild(kbds(r[0]));
      var dd = document.createElement('dd'); dd.textContent = r[1];
      row.appendChild(dt); row.appendChild(dd);
      list.appendChild(row);
    });
    sec.appendChild(list);
    groups.appendChild(sec);
  });

  var filter = document.getElementById('filter');
  filter.addEventListener('input', function () {
    var q = filter.value.trim().toLowerCase(), any = false;
    document.querySelectorAll('.m-group').forEach(function (sec) {
      var shown = 0;
      sec.querySelectorAll('.m-row').forEach(function (row) {
        var hit = !q || row.dataset.text.indexOf(q) >= 0 || row.textContent.toLowerCase().indexOf(q) >= 0;
        row.hidden = !hit; if (hit) shown++;
      });
      sec.hidden = !shown; if (shown) any = true;
    });
    document.getElementById('nothing').hidden = any;
  });
})();
</script>
