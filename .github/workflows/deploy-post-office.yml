# Publishes server/ (the Sidearm post office) to Cloudflare Workers, then runs the end-to-end check against it.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" token) and CLOUDFLARE_ACCOUNT_ID.
# Without them it does nothing (so the repo doesn't go red before they're set).
# Failures are written as annotations ("::error::"), so they can be read through the API without the raw log.
name: Deploy post office

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/deploy-post-office.yml']

concurrency: post-office

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Secrets set?
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID aren't set yet, so nothing is deployed."
      - uses: actions/checkout@v5
        if: env.HAS_TOKEN == 'true'
      - uses: actions/setup-node@v5
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 22
      - name: Install
        if: env.HAS_TOKEN == 'true'
        working-directory: server
        run: npm install --no-audit --no-fund
      - name: Deploy
        id: deploy
        if: env.HAS_TOKEN == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          npx wrangler deploy 2>&1 | tee deploy.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" != "0" ]; then
            # the useful part of wrangler's complaint, as one annotation (no secrets are ever printed by wrangler)
            msg=$(grep -E "ERROR|✘|error|Error|code:" deploy.log | grep -v "^\s*$" | head -12 | tr '\n' ' ' | cut -c1-900)
            echo "::error title=wrangler deploy failed::${msg:-$(tail -8 deploy.log | tr '\n' ' ' | cut -c1-900)}"
            exit 1
          fi
          url=$(grep -oE "https://[a-zA-Z0-9.-]+\.workers\.dev" deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice title=Post office::$url"
      - name: Check the live post office
        if: env.HAS_TOKEN == 'true'
        working-directory: server
        run: |
          url="${{ steps.deploy.outputs.url }}"
          if [ -z "$url" ]; then echo "::error title=no URL::wrangler didn't print a workers.dev address (is a workers.dev subdomain set up?)"; exit 1; fi
          set +e
          node test/smoke.mjs "$url" 2>&1 | tee smoke.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" != "0" ]; then
            echo "::error title=live check failed::$(grep -E 'FAIL|Error|error' smoke.log | head -8 | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          echo "::notice title=Live check::$(tail -1 smoke.log)"
